<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <title>Navegador no compatible (406) - Jardín LAC Vizcaínas</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: #fcfaf5;
        color: #2d241e;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      .card {
        width: 100%;
        max-width: 580px;
        background: #ffffff;
        border: 1px solid #e6decb;
        border-radius: 0.5rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 4px 20px rgba(45, 36, 30, 0.08);
      }
      .code {
        display: inline-block;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        background: rgba(133, 99, 32, 0.12);
        border: 1px solid rgba(133, 99, 32, 0.35);
        color: #856320;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        color: #7c1933;
        margin-bottom: 0.75rem;
        line-height: 1.2;
      }
      p {
        color: #5c5044;
        font-size: 0.98rem;
        margin-bottom: 1.75rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.6rem 1.25rem;
        border-radius: 0.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      .btn-primary {
        background: #7c1933;
        color: #ffffff;
        border: 1px solid #7c1933;
      }
      .brand {
        margin-top: 1.75rem;
        padding-top: 1rem;
        border-top: 1px solid #e6decb;
        color: #6b5c4e;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="code">Error 406</span>
      <h1>Tu navegador no es compatible</h1>
      <p>Actualiza tu navegador a una versión reciente para utilizar el sistema de recomendaciones y las visualizaciones del catálogo.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Volver al Inicio</a>
      </div>
      <div class="brand">Jardín LAC Vizcaínas</div>
    </main>
  </body>
</html>
