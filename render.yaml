services:
  - type: web
    name: jardin-lac-vizcainas-recs
    runtime: ruby
    buildCommand: bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /healthz
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      # Render free tier is 512 MB / 0.1 CPU. WEB_CONCURRENCY=0 keeps Puma in
      # single-process mode without a separate worker fork, holding one copy
      # of the SQLite FTS5 page cache and ONNX runtime while preventing thread
      # contention at RAILS_MAX_THREADS=1.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "1"
