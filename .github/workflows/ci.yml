name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test data pipeline scripts
        run: python3 -m py_compile pipeline/*.py pipeline/tests/*.py && python3 -m unittest discover -s pipeline/tests -v

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  import_smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database and import deploy data
        env:
          RAILS_ENV: test
        run: SKIP_SEEDS=1 bin/rails db:prepare && bin/rails import:all

      - name: Smoke check imported counts
        env:
          RAILS_ENV: test
        run: |
          bin/rails runner '
            checks = {
              "books" => [Book.count, 100],
              "patrons" => [Patron.count, 100],
              "checkouts" => [Checkout.count, 1000],
              "authorities" => [Authority.count, 1000],
              "book_connections" => [BookConnection.count, 100],
              "content_similarities" => [ContentSimilarity.count, 1000],
              "user_similarities" => [UserSimilarity.count, 1000],
              "book_words" => [BookWord.count, 1000],
              "fts5_rows" => [ActiveRecord::Base.connection.select_value("SELECT COUNT(*) FROM book_words_fts").to_i, 1000],
              "embeddings" => [Book.where.not(embedding: nil).count, 100]
            }

            failures = checks.filter_map do |name, (actual, minimum)|
              puts "#{name}: #{actual} (expected >= #{minimum})"
              "#{name}=#{actual}" if actual < minimum
            end

            abort("Import smoke check failed: #{failures.join(", ")}") if failures.any?
          '

      - name: Run live catalog search smoke tests
        env:
          RAILS_ENV: test
        run: RUN_IMPORT_SMOKE=1 bin/rails test test/integration/smoke_search_test.rb
